# ==========================
# SDN Controller Configuration
# ==========================
controller:
  name: "AI-QoS-SDN"
  openflow_version: "1.3"

monitoring:
  polling_interval: 5
  statistics_interval: 5

traffic:
  congestion_threshold: 0.80
  packet_loss_threshold: 0.05

dataset:
  raw_output: "../datasets/raw/telemetry.csv"
  processed_output: "../datasets/processed/telemetry_processed.csv"

logging:
  level: INFO
  file: "../logs/controller.log"
